<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Almacén</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-container">
    <div class="segmented-control">
        <button class="tab-link active-tab" onclick="changeTab('registro')">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Ingreso
        </button>
        <button class="tab-link" onclick="changeTab('stock')">
            <svg viewBox="0 0 24 24"><path d="M5 5h3v14H5zm5.5 0h3v14h-3zm5.5 0h3v14h-3z"/></svg>
            Stock
        </button>
        <button class="tab-link" onclick="changeTab('config-cat')">
            <svg viewBox="0 0 24 24"><path d="M10 20h4v-4h-4v4zm0-6h4v-4h-4v4zm0-6h4V4h-4v4z"/></svg>
            Clases
        </button>
    </div>

    <div id="panel-registro" class="panel-content active-panel">
        <form id="formNuevo">
            <div class="ios-card">
                <div class="input-group">
                    <label for="nombre">Nombre del Producto</label>
                    <input type="text" id="nombre" required placeholder="Ej: Casaca Bomber">
                </div>
                <div class="input-group">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" required></select>
                </div>
            </div>

            <div class="ios-card">
                <label style="margin-bottom: 12px;">Fotografía</label>
                <div class="upload-options">
                    <label for="fileInput" class="btn-ios-secondary">📁 Galería</label>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    
                    <label for="cameraInput" class="btn-ios-secondary">📷 Cámara</label>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
                </div>
                <img id="imagePreview" class="preview-box-img" alt="Vista previa">
                <input type="hidden" id="imageData" required>
                <input type="hidden" id="imageType"><input type="hidden" id="imageName">
            </div>

            <div class="ios-card">
                <label style="margin-bottom: 12px;">Cantidades Iniciales</label>
                <div class="grid-tallas">
                    <div class="box-talla">
                        <label for="tallaS">S</label>
                        <input type="number" id="tallaS" min="0" value="0" required>
                        <button type="button" class="btn-talla-color" onclick="abrirModalColores('registro', 'S')">🎨 Colores</button>
                    </div>
                    <div class="box-talla">
                        <label for="tallaM">M</label>
                        <input type="number" id="tallaM" min="0" value="0" required>
                        <button type="button" class="btn-talla-color" onclick="abrirModalColores('registro', 'M')">🎨 Colores</button>
                    </div>
                    <div class="box-talla">
                        <label for="tallaL">L</label>
                        <input type="number" id="tallaL" min="0" value="0" required>
                        <button type="button" class="btn-talla-color" onclick="abrirModalColores('registro', 'L')">🎨 Colores</button>
                    </div>
                    <div class="box-talla">
                        <label for="tallaXL">XL</label>
                        <input type="number" id="tallaXL" min="0" value="0" required>
                        <button type="button" class="btn-talla-color" onclick="abrirModalColores('registro', 'XL')">🎨 Colores</button>
                    </div>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-ios-primary">Registrar Prenda</button>
            <div id="mensaje" class="banner-alert"></div>
        </form>
    </div>

    <div id="panel-stock" class="panel-content">
        <div class="stock-tools">
            <input type="text" id="searchBar" class="search-input" placeholder="🔍 Buscar por nombre..." oninput="ejecutarBusquedaCombinada()">
            <select id="filterCategoria" class="filter-select" onchange="ejecutarBusquedaCombinada()"></select>
            <button class="btn-sync-ios" onclick="cargarDatosBase()">🔄</button>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th class="cell-left">Prenda</th>
                        <th>S</th><th>M</th><th>L</th><th>XL</th>
                        <th>Editar</th>
                    </tr>
                </thead>
                <tbody id="tablaStockBody"></tbody>
            </table>
            <div id="stockLoadingLabel" class="label-loading" style="display: none;">Cargando almacén...</div>
        </div>
    </div>

    <div id="panel-config-cat" class="panel-content">
        <div class="ios-card" style="margin-bottom: 16px;">
            <label>Nueva Categoría</label>
            <div style="display:flex; gap:8px; margin-top: 6px;">
                <input type="text" id="newCatInput" placeholder="Ej: Chaleco">
                <button type="button" class="btn-ios-add" onclick="agregarNuevaCategoriaServidor()">Añadir</button>
            </div>
        </div>
        <div class="category-list" id="listaCategoriasContenedor"></div>
        <div id="catMensaje" class="banner-alert"></div>
    </div>
</div>

<div id="editModal" class="backdrop-modal">
    <div class="modal-body">
        <h3 style="text-align: center; margin-bottom: 16px;">Modificar Registro</h3>
        <form id="formEdit">
            <input type="hidden" id="editRowNum">
            <div class="input-group">
                <label for="editNombre">Nombre</label>
                <input type="text" id="editNombre" required>
            </div>
            <div class="input-group">
                <label for="editCategoria">Categoría</label>
                <select id="editCategoria" required></select>
            </div>
            <div class="input-group">
                <label>Foto de Referencia</label>
                <div class="upload-options">
                    <label for="editFileInput" class="btn-ios-secondary">📁 Galería</label>
                    <input type="file" id="editFileInput" accept="image/*" style="display: none;">
                    
                    <label for="editCameraInput" class="btn-ios-secondary">📷 Cámara</label>
                    <input type="file" id="editCameraInput" accept="image/*" capture="environment" style="display: none;">
                </div>
                <img id="editImagePreview" class="preview-box-img" alt="Nueva foto">
                <input type="hidden" id="editImageData">
                <input type="hidden" id="editImageType"><input type="hidden" id="editImageName">
            </div>
            <div class="input-group">
                <label>Existencias</label>
                <div class="grid-tallas">
                    <div class="box-talla">
                        <label for="editTallaS">S</label>
                        <input type="number" id="editTallaS" min="0" required>
                        <button type="button" class="btn-talla-color" onclick="abrirModalColores('editar', 'S')">🎨 Colores</button>
                    </div>
                    <div class="box-talla">
                        <label for="editTallaM">M</label>
                        <input type="number" id="editTallaM" min="0" required>
                        <button type="button" class="btn-talla-color" onclick="abrirModalColores('editar', 'M')">🎨 Colores</button>
                    </div>
                    <div class="box-talla">
                        <label for="editTallaL">L</label>
                        <input type="number" id="editTallaL" min="0" required>
                        <button type="button" class="btn-talla-color" onclick="abrirModalColores('editar', 'L')">🎨 Colores</button>
                    </div>
                    <div class="box-talla">
                        <label for="editTallaXL">XL</label>
                        <input type="number" id="editTallaXL" min="0" required>
                        <button type="button" class="btn-talla-color" onclick="abrirModalColores('editar', 'XL')">🎨 Colores</button>
                    </div>
                </div>
            </div>
            
            <button type="button" id="btnDeletePrenda" class="btn-ios-delete-main" onclick="eliminarPrendaActual()">Eliminar Prenda del Almacén</button>

            <div class="modal-buttons-layout">
                <button type="button" class="btn-ios-cancel" onclick="closeModal()">Cancelar</button>
                <button type="submit" id="btnSaveEdit" class="btn-ios-save">Guardar</button>
            </div>
            <div id="editMensaje" class="banner-alert"></div>
        </form>
    </div>
</div>

<div id="colorModal" class="backdrop-modal" style="z-index: 3000;">
    <div class="modal-body" style="max-width: 350px;">
        <h3 id="colorModalTitle" style="text-align: center; margin-bottom: 12px;">Desglose de Colores</h3>
        <div id="colorInputsContainer" style="max-height: 250px; overflow-y: auto; margin-bottom: 12px;"></div>
        <button type="button" class="btn-ios-secondary" style="padding: 8px; font-size: 13px; margin-bottom: 14px;" onclick="agregarFilaColorBlanco()">+ Agregar otro color</button>
        <div class="modal-buttons-layout">
            <button type="button" class="btn-ios-cancel" onclick="cerrarModalColores()">Cerrar</button>
            <button type="button" class="btn-ios-save" onclick="guardarModalColores()">Aplicar</button>
        </div>
    </div>
</div>

<div id="detailModal" class="backdrop-modal">
    <div class="modal-body" style="max-width: 330px; text-align: center;">
        <h3 id="detailTitle" style="margin-bottom: 4px;">Nombre de Prenda</h3>
        <p id="detailCategory" style="font-size: 13px; color: var(--ios-secondary-text); margin: 0 0 16px 0;">Categoría</p>
        <div id="detailContentContainer" style="text-align: left; max-height: 300px; overflow-y: auto; margin-bottom: 16px;"></div>
        <div class="modal-buttons-layout" style="border-top: 0.5px solid #3c3c434d;">
            <button type="button" class="btn-ios-save" style="width: 100%; text-align: center;" onclick="cerrarModalDetalle()">Listo</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
